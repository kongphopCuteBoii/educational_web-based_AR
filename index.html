<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Educational Web-based AR</title>

    <!-- Google Fonts: Prompt & Monospace for Logs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@200;300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <!-- Mobile Console -->
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script> var vConsole = new VConsole(); </script>

    <!-- Imports -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.147.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.147.0/examples/jsm/",
        "gltfloader": "https://unpkg.com/three@0.147.0/examples/jsm/loaders/GLTFLoader.js",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>

    <!-- LOAD MAIN.JS (Must be module) -->
    <script src="lib/main.js" type="module"></script>

    <style>
        :root { --glass-border: rgba(255, 255, 255, 0.1); }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; /* Default to Black */
            color: #f3f4f6;
            overflow: hidden;
            font-family: 'Prompt', sans-serif;
            letter-spacing: -0.5px; 
        }

        /* The AR Video Layer */
        video {
            position: absolute !important;
            top: 50% !important; left: 50% !important;
            transform: translate(-50%, -50%) !important;
            min-width: 100vw !important; min-height: 100vh !important;
            width: auto !important; height: auto !important;
            object-fit: cover !important; z-index: -2 !important;
        }

        #container {
            width: 100vw; height: 100vh;
            position: absolute; top: 0; left: 0; z-index: 1;
        }

        /* --- SCREEN 1: INTRO --- */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px; text-align: center;
            transition: opacity 0.8s ease; /* Fade Black */
            cursor: pointer;
        }

        .intro-text {
            font-size: 1.1rem; font-weight: 300; line-height: 1.5;
            color: white; opacity: 1;
        }
        .intro-sub {
            margin-top: 40px; font-size: 0.85rem; color: #666;
            animation: pulse 2s infinite ease-in-out;
        }

        /* --- SCREEN 2: LANDING PAGE --- */
        #landing-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            /* Black Fade Gradient */
            background: radial-gradient(circle at 50% -20%, #1a1a1a 0%, #000000 90%);
            opacity: 0; pointer-events: none;
            transition: opacity 1s ease;
        }
        
        .content-wrapper { text-align: center; max-width: 800px; padding: 0 20px; z-index: 2; }

        h1 {
            font-weight: 500; font-size: clamp(2rem, 5vw, 4rem); margin: 0; line-height: 1.1;
            background: linear-gradient(180deg, #fff 0%, #888 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .advisor { margin-top: 15px; font-size: 1.1rem; color: #aaa; font-weight: 300; }
        .subtitle { margin-top: 25px; font-size: 0.95rem; color: #888; font-weight: 300; line-height: 1.6; }

        /* BUTTON & STATUS LOG */
        #startButton {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; padding: 14px 45px; font-size: 1rem;
            border-radius: 50px; cursor: pointer;
            backdrop-filter: blur(10px);
            font-family: 'Prompt', sans-serif;
            transition: all 0.3s ease;
        }
        #startButton:disabled { opacity: 0.5; cursor: wait; }

        #status-log {
            margin-top: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: #00ff88; /* Matrix Green */
            min-height: 20px;
            opacity: 0.8;
        }

        /* CREDITS */
        .credits { margin-top: 50px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .staff-member {
            width: 45px; height: 45px; border-radius: 50%; background: #222;
            border: 1px solid var(--glass-border); overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        .staff-member img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%); }

        /* AR UI */
        #ar-interface {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: none; pointer-events: none;
        }
        .scan-frame {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70vw; height: 70vw; border: 1px solid rgba(255,255,255,0.3); border-radius: 20px;
        }
        #stopButton {
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.9); color: white; border: none;
            padding: 10px 28px; border-radius: 30px; pointer-events: auto;
            font-family: 'Prompt', sans-serif;
        }

        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .hidden { display: none !important; }
        .visible { opacity: 1 !important; pointer-events: auto !important; }
    </style>
</head>
<body>

    <!-- 1. INTRO -->
    <div id="intro-screen">
        <div class="intro-text">
            Tech Demo นี้จัดทำขึ้นเพื่อทดสอบขีดความสามารถของ WebGL<br>
            โปรดเตรียม Marker ให้พร้อมก่อนเริ่มทดสอบระบบ
        </div>
        <div class="intro-sub">( แตะหน้าจอเพื่อดำเนินการต่อ )</div>
    </div>

    <!-- 2. LANDING -->
    <div id="landing-page">
        <div class="content-wrapper">
            <h1>สื่อการเรียนรู้<br>Web-based AR</h1>
            <div class="advisor">นำเสนอ ครูชาลิณี สุทธะมี</div>
            <p class="subtitle">
                ขับเคลื่อนด้วย MindAR และ ThreeJS เพื่อการรองรับที่ครอบคลุมและเสถียรบนทุกแพลตฟอร์ม
            </p>

            <button id="startButton">เริ่มรันระบบ</button>
            <div id="status-log">System Standby...</div> <!-- Status Log -->

            <div class="credits">
                <div class="staff-member"><img src="https://ui-avatars.com/api/?name=L&background=333&color=fff" alt="1"></div>
                <div class="staff-member"><img src="https://ui-avatars.com/api/?name=D&background=333&color=fff" alt="2"></div>
                <div class="staff-member"><img src="https://ui-avatars.com/api/?name=3&background=333&color=fff" alt="3"></div>
                <div class="staff-member"><img src="https://ui-avatars.com/api/?name=M&background=333&color=fff" alt="4"></div>
                <div class="staff-member"><img src="https://ui-avatars.com/api/?name=T&background=333&color=fff" alt="5"></div>
            </div>
        </div>
    </div>

    <!-- 3. AR UI -->
    <div id="ar-interface">
        <div class="scan-frame"></div>
        <button id="stopButton">จบการทำงาน</button>
    </div>

    <div id="container"></div>

    <script>
        const intro = document.getElementById('intro-screen');
        const landing = document.getElementById('landing-page');
        const startBtn = document.getElementById('startButton');
        const statusLog = document.getElementById('status-log');
        const stopBtn = document.getElementById('stopButton');

        // Transition: Intro -> Landing
        intro.addEventListener('click', () => {
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.classList.add('hidden');
                landing.classList.add('visible');
            }, 800);
        });

        // ACTION: Start Button
        startBtn.addEventListener('click', () => {
            startBtn.disabled = true;
            statusLog.innerText = "[SYSTEM]: Requesting Main Module...";
            
            // Check if Main.js loaded
            if (window.startARSystem) {
                // Call the function inside main.js
                window.startARSystem(
                    // Callback to update status text
                    (msg) => { statusLog.innerText = "[SYSTEM]: " + msg; },
                    // Callback when done
                    () => { 
                        landing.style.opacity = '0';
                        setTimeout(() => {
                            landing.classList.remove('visible');
                            document.getElementById('ar-interface').style.display = 'block';
                            document.body.style.backgroundColor = 'transparent'; // Show Camera
                        }, 500);
                    }
                );
            } else {
                statusLog.innerText = "[ERROR]: Main.js not loaded.";
                statusLog.style.color = 'red';
                startBtn.disabled = false;
            }
        });

        // ACTION: Stop Button
        stopBtn.addEventListener('click', () => {
             if(window.stopARSystem) window.stopARSystem();
             location.reload(); // Simple reload to reset everything cleanly
        });
    </script>
</body>
</html>
