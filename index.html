<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- FIXED: Added user-scalable=no and viewport-fit=cover to fix sizing issues -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Educational AR Experience</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script>
      var vConsole = new VConsole();
    </script>

    <!-- IMPORTS CHANGED TO 0.147.0 TO FIX CONSOLE ERRORS -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.147.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.147.0/examples/jsm/",
        "gltfloader": "https://unpkg.com/three@0.147.0/examples/jsm/loaders/GLTFLoader.js",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>

    <!-- Point to root main.js -->
    <script src="main.js" type="module"></script>

    <style>
        :root {
            --primary-color: #6366f1;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-dark: #1e293b;
            --text-light: #64748b;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000; /* Black background hides gaps if any */
        }

        /* FIXED: Force Video to Stretch */
        video {
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            min-width: 100vw !important;
            min-height: 100vh !important;
            width: auto !important;
            height: auto !important;
            object-fit: cover !important;
            z-index: -2 !important;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Styles */
        #landing-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            background: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 85%;
            width: 350px;
        }

        h1 { margin: 0 0 10px 0; color: var(--text-dark); font-weight: 800; font-size: 2rem; }
        p { margin: 0 0 30px 0; color: var(--text-light); }
        .badge { background: #e0e7ff; color: var(--primary-color); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 20px; display: inline-block; }

        #ar-interface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: none; 
        }

        .scan-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw;
            height: 70vw;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        
        .scan-text {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            color: white;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .primary-btn {
            background-color: var(--primary-color);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 16px 32px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .primary-btn:active { transform: scale(0.98); }
        .primary-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

        #stopButton {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="landing-page">
        <div class="card">
            <div class="badge">WEB AR EXPERIENCE</div>
            <h1>Learn in 3D</h1>
            <p>Point your camera at the marker cards.</p>
            <button id="startButton" class="primary-btn">
                <span class="btn-text">Start Experience</span>
                <div class="spinner"></div>
            </button>
        </div>
    </div>

    <div id="ar-interface">
        <div class="scan-frame">
            <div class="scan-text">Scan Image Target</div>
        </div>
        <button id="stopButton">Stop AR</button>
    </div>

    <div id="container"></div>

    <script>
        const startBtn = document.getElementById('startButton');
        const spinner = document.querySelector('.spinner');
        const btnText = document.querySelector('.btn-text');
        
        startBtn.addEventListener('click', () => {
            console.log("UI: Button Clicked");
            startBtn.disabled = true;
            btnText.textContent = "Loading...";
            spinner.style.display = "block";
            
            setTimeout(() => {
                if (!window.AR_STARTED && !window.AR_ENGINE_READY) {
                    alert("Main.js is slow to load. Please wait or refresh.");
                    startBtn.disabled = false;
                    btnText.textContent = "Try Again";
                    spinner.style.display = "none";
                }
            }, 8000);
        });

        window.hideLanding = () => {
            window.AR_STARTED = true;
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('ar-interface').style.display = 'block';
        };

        window.showLanding = () => {
            window.AR_STARTED = false;
            document.getElementById('landing-page').classList.remove('hidden');
            document.getElementById('ar-interface').style.display = 'none';
            startBtn.disabled = false;
            btnText.textContent = "Start Experience";
            spinner.style.display = "none";
        };
    </script>
</body>
</html>
