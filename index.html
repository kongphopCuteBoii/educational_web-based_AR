<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Educational Web-based AR</title>

    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@200;300;400;500;600&display=swap" rel="stylesheet">

    <!-- Mobile Console -->
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
    <script> var vConsole = new VConsole(); </script>

    <!-- Imports (Three.js v147) -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.147.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.147.0/examples/jsm/",
        "gltfloader": "https://unpkg.com/three@0.147.0/examples/jsm/loaders/GLTFLoader.js",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
    </script>

    <!-- แก้ไขตรงนี้: ชี้กลับไปที่โฟลเดอร์ lib/main.js -->
    <script src="lib/main.js" type="module"></script>

    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #0f1012;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow: hidden;
            font-family: 'Prompt', sans-serif;
            letter-spacing: -0.5px; 
        }

        /* Essential Video CSS */
        video {
            position: absolute !important;
            top: 50% !important; left: 50% !important;
            transform: translate(-50%, -50%) !important;
            min-width: 100vw !important; min-height: 100vh !important;
            width: auto !important; height: auto !important;
            object-fit: cover !important; z-index: -2 !important;
        }

        #container {
            width: 100vw; height: 100vh;
            position: absolute; top: 0; left: 0; z-index: 1;
        }

        /* --- SCREEN 1: INTRO --- */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            z-index: 100;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px; text-align: center;
            transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .intro-text {
            font-size: 1.1rem; 
            font-weight: 300; 
            line-height: 1.5;
            max-width: 600px;
            color: white;
            opacity: 0;
            animation: fadeUp 1s ease-out forwards 0.5s;
        }

        .intro-sub {
            margin-top: 40px;
            font-size: 0.85rem; 
            color: #666;
            opacity: 0;
            animation: pulse 2s infinite ease-in-out 1.5s forwards;
            font-weight: 400;
        }

        /* --- SCREEN 2: LANDING PAGE --- */
        #landing-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: radial-gradient(circle at 50% -20%, #2a2d33 0%, #050505 60%);
            opacity: 0; pointer-events: none;
            transition: opacity 1s ease;
        }
        
        .fog-glow {
            position: absolute; top: 20%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0) 70%);
            filter: blur(60px);
            z-index: -1;
            animation: fogMove 10s infinite alternate ease-in-out;
        }

        .content-wrapper {
            text-align: center;
            max-width: 800px;
            padding: 0 20px;
            z-index: 2;
        }

        h1 {
            font-weight: 500;
            font-size: clamp(2rem, 5vw, 4rem);
            margin: 0;
            line-height: 1.1;
            background: linear-gradient(180deg, #fff 0%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 20px 40px rgba(0,0,0,0.5);
            letter-spacing: -1.5px;
        }

        .advisor {
            margin-top: 15px;
            font-size: clamp(1rem, 1.5vw, 1.2rem);
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin-top: 25px;
            font-size: clamp(0.9rem, 1.5vw, 1.05rem);
            color: var(--text-secondary);
            font-weight: 300;
            line-height: 1.6;
            max-width: 680px;
            margin-left: auto; margin-right: auto;
        }

        #startButton {
            margin-top: 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 14px 45px;
            font-size: 1rem;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-family: 'Prompt', sans-serif;
            font-weight: 400;
            letter-spacing: -0.5px;
        }

        #startButton:hover {
            background: white;
            color: black;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        #startButton:disabled {
            opacity: 0.5; cursor: not-allowed;
            background: rgba(255,255,255,0.1); color: #888;
        }

        .credits {
            margin-top: 60px;
            display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
        }

        .staff-member {
            width: 45px; height: 45px;
            border-radius: 50%;
            background: #222;
            border: 1px solid var(--glass-border);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
        }

        .staff-member img {
            width: 100%; height: 100%; object-fit: cover;
            filter: grayscale(100%); transition: filter 0.3s ease;
        }

        .staff-member:hover { transform: translateY(-5px) scale(1.1); border-color: white; }
        .staff-member:hover img { filter: grayscale(0%); }

        .staff-member::after {
            content: attr(data-name);
            position: absolute; bottom: -25px;
            font-size: 0.65rem; color: rgba(255,255,255,0.8); 
            opacity: 0; white-space: nowrap; 
            transition: opacity 0.3s ease;
            font-weight: 300;
            letter-spacing: 0px;
        }
        .staff-member:hover::after { opacity: 1; }

        #ar-interface {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: none; pointer-events: none;
        }

        .scan-frame {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 70vw; height: 70vw;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        
        .scan-corner { position: absolute; width: 20px; height: 20px; border-color: white; border-style: solid; opacity: 0.8; }
        .tl { top: -1px; left: -1px; border-width: 3px 0 0 3px; border-radius: 10px 0 0 0;}
        .tr { top: -1px; right: -1px; border-width: 3px 3px 0 0; border-radius: 0 10px 0 0;}
        .bl { bottom: -1px; left: -1px; border-width: 0 0 3px 3px; border-radius: 0 0 0 10px;}
        .br { bottom: -1px; right: -1px; border-width: 0 3px 3px 0; border-radius: 0 0 10px 0;}

        #stopButton {
            position: absolute; bottom: 50px; left: 50%;
            transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.85);
            color: white; border: none;
            padding: 10px 28px; border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500; pointer-events: auto; cursor: pointer;
            backdrop-filter: blur(5px);
