# Deploy the main site normally, and keep the feature branch available at /preview/.
name: Deploy static content to Pages

on:
  push:
    branches: ["main", "feat/data-driven-ar-content"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment ref
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout main for preview deployment
        if: github.ref_name == 'feat/data-driven-ar-content'
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source

      - name: Stage main site
        if: github.ref_name == 'main'
        run: |
          mkdir -p site
          rsync -a --exclude='.git' --exclude='.github' source/ site/

      - name: Stage main site plus feature preview
        if: github.ref_name == 'feat/data-driven-ar-content'
        run: |
          mkdir -p site/preview
          rsync -a --exclude='.git' --exclude='.github' main-source/ site/
          rsync -a --exclude='.git' --exclude='.github' source/ site/preview/
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
